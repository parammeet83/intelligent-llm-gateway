# RouteWise model registry.
#
# Rules:
# - Every real model needs `verified_on` and `source_url` pointing at the provider's official docs.
# - `pricing` holds a published pay-as-you-go LIST price, used only for the shadow (estimated) cost.
#   It is not what a free-tier call actually costs. No `pricing` = no published price: the model is
#   excluded from strictly budgeted requests rather than being treated as $0.
# - `billing: paid` models are rejected while ALLOW_PAID_MODELS is false (always, in this project).
# - Tiers reflect capability, not price. Routing picks the cheapest eligible model at or above the
#   tier a request needs.
# - A model is only used if its provider is enabled in .env and (when the provider publishes a
#   model list) it appears in that live list at startup.
# - Mock models are `simulated: true`, and so are their prices. They exist for dev and tests only.

models:
  # --- Groq (https://console.groq.com/docs/models, verified 2026-11-04) ----------------------
  # Groq's Free plan is $0; list prices below are Groq's published on-demand (Developer) prices.
  - provider: groq
    model_id: llama-3.1-8b-instant
    display_name: Llama 3.1 8B Instant (Groq)
    tier: small
    billing: free
    context_window: 131072
    max_output_tokens: 131072
    capabilities: [json_mode]
    enabled: false  # retired: see notes
    verified_on: 2026-11-04
    source_url: https://console.groq.com/docs/deprecations
    notes: >-
      Shut down 2026-08-16 per Groq's deprecations page (replacement openai/gpt-oss-20b). A live
      call on 2026-11-04 returned 404 model_not_found. Price was "Contact Sales" (no list price).

  - provider: groq
    model_id: llama-3.3-70b-versatile
    display_name: Llama 3.3 70B Versatile (Groq)
    tier: medium
    billing: free
    context_window: 131072
    max_output_tokens: 32768
    capabilities: [json_mode]
    enabled: false  # retired: see notes
    verified_on: 2026-11-04
    source_url: https://console.groq.com/docs/deprecations
    notes: >-
      Shut down 2026-08-16 per Groq's deprecations page (replacements openai/gpt-oss-120b or
      qwen/qwen3.6-27b). Price was "Contact Sales" (no list price).

  - provider: groq
    model_id: openai/gpt-oss-20b
    display_name: GPT-OSS 20B (Groq)
    # Small-tier Groq model since the Llama 3.1 8B shutdown (Groq's named replacement). It is
    # a reasoning model: low effort keeps hidden reasoning from eating small output limits.
    tier: small
    billing: free
    context_window: 131072
    max_output_tokens: 65536
    capabilities: [json_mode, json_schema, reasoning]
    reasoning_effort: low
    verified_on: 2026-11-04
    source_url: https://console.groq.com/docs/models
    pricing:
      input_usd_per_mtok: "0.075"
      output_usd_per_mtok: "0.30"
      effective_date: 2026-11-03
      source_url: https://console.groq.com/docs/models
      notes: Page shows no effective date; this is the date first observed. Re-checked unchanged 2026-11-04.

  - provider: groq
