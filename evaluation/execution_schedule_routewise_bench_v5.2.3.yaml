rules:
- Each case's three strategies run on the same scheduled day, in the registered interleaved order (alternating
  by the case's dataset index).
- Days run in order 1, 2, 3, 4, each on its own UTC date; day 4's date at most 14 days after day 1's.
- Each day runs exactly once. No day, case or strategy is ever re-run. A day that is stopped or incomplete
  makes the whole comparison incomplete (not publishable); nothing is excluded selectively. Provider errors
  count as missing under run_validity.
- 'Before a day: read both models'' remaining daily tokens in the Groq console (same UTC date) and supply
  the smaller one; the day''s preflight must pass (it needs at least required_remaining_daily_tokens).
  If it fails, don''t start; use a later UTC date within the span.'
- 'Start a day at least 2 hours before 00:00 UTC: the budget is valid only on its UTC date, and the guard
  stops a run that crosses midnight.'
- Before each day, check that Groq still lists openai/gpt-oss-20b and openai/gpt-oss-120b unchanged (models
  and deprecations pages); the run's own catalog check must list both. If either changes or is deprecated
  during the schedule, the comparison is incomplete.
- Keep all other traffic off the Groq organisation while a day runs; the persistent ledger carries usage
  across processes and restarts.
- 'The registered analysis is the combined report of all four days (eval-combine): every case and strategy
  pooled, paired by case, with the registered statistics. Per-day figures are descriptive only.'
