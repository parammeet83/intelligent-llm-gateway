changes_from_prereg_v5_2_1:
- Administrative publication-gate amendment only. A case counts as human-reviewed if it has a valid owner-reviewed
  entry in the pinned metadata's reviewed_by, OR it is covered by the pinned owner review attestation.
  The metadata (reviewed_by empty) and the attestation are both pinned by exact SHA-256 here and in the
  manifest.
- The attestation is accepted only if its exact bytes, reviewer role, creation time and owner confirmations
  match this registration; it names this dataset, its metadata and this scoring amendment; it reviews
  exactly the 45 dataset cases, each explicitly approved and bound to the SHA-256 of its exact dataset
  line; S15, T11 and C12 (and only they) are approved after the scoring amendment with its conditions;
  and its v5.2.1 references match the actual files. Otherwise the run is refused (fail closed).
- T17 was reviewed with translator assistance (the owner checked the Spanish options with Google Translate).
  It is recorded and reported as translator-assisted owner review, NOT native-speaker or independent linguistic
  validation.
- Every run snapshot and report records the attestation's SHA-256, the reviewer role, the review methods
  and the T17 disclosure.
- 'Dataset, prompts, expected answers, scoring (including the v5.2.1 amendment), execution, quota, quality,
  cost, scope and validity rules: unchanged from prereg-v5.2.1.'

strategies:
  baseline_premium: >-
    Every case requested with preferred_tier=premium. Premium-only generation is guaranteed by
    construction (tier floor, no downgrade, TIER_TOO_LOW exclusion, executor calls eligible models
    only) and verified per attempt (baseline_tier_guard).
  routewise: Routing policy as pinned in the manifest (selection = cheapest_capable).
  routewise_tier_first: Same policy with selection = lowest_tier_first.

baseline_tier_guard: premium_only

quota:
  provider: groq
  applies_to: all Groq models combined (a self-imposed aggregate; stricter than Groq's per-model limits)
  reservation: >-
    Each actual provider attempt reserves input_bound + output_bound before transmission, as a
    ledger transaction (lock, re-read, check, write, unlock). Exactly one reservation per network
    attempt. Settlement changes only daily_tokens and status; tpm_reserved_tokens stays the worst
    case for the full 60 seconds. not_sent releases both budgets; sent_unknown keeps the worst
    case in both.
  token_accounting:
    strict_content_bound: "UTF-8 bytes of all message contents. Strict for byte-level BPE tokenizers (at most one token per byte)."
    empirical_framing_allowance: "256 tokens per attempt for the chat-template framing and any provider-injected preamble. EMPIRICAL, NOT a guaranteed bound: derived from one observed request (83 input tokens for a 53-byte prompt, so framing <= 82). If a response reports more input tokens than reserved, the run stops after that attempt, which has already been sent."
    output_bound: "the case's max_output_tokens (the provider's max_completion_tokens cap, including reasoning tokens)."
    provider_reported_usage: "the provider's reported input/output tokens: used for the daily budget after the attempt, and checked against the reserved bounds. Never used to shrink the per-minute reservation."
  limits:
    tokens_per_minute: {value: 8000, safety: 0.75, status: "SELF-IMPOSED aggregate cap, set at the value observed in x-ratelimit-limit-tokens for openai/gpt-oss-20b on this key (2026-11-04, one response). gpt-oss-120b and Free-plan limits are NOT known and NOT inferred; a lower header value tightens the cap"}
    requests_per_day: {value: 1000, safety: 0.9, status: "SELF-IMPOSED aggregate cap, set at the value observed in x-ratelimit-limit-requests for openai/gpt-oss-20b (one response); 120B / Free-plan limits not known, not inferred"}
    requests_per_minute_cap: {value: 10, status: "self-imposed; Groq RPM for this account is not verified and not exposed in headers"}
    tokens_per_day: {value: null, status: "NOT verified. An operator-supplied remaining daily token budget with source and verification time (same UTC day) is required; the preflight and run fail closed without it"}
  ledger:
    file: evaluation/reports/quota_ledger.json (+ .lock sidecar)
    format: 2
    concurrency: exclusive OS file lock per transaction (msvcrt on Windows, fcntl on POSIX), released by the OS if the holder dies
    restart: the per-minute window, daily usage and latest headers are rebuilt from the file
  headers: >-
    x-ratelimit-limit-tokens / remaining-tokens (per minute) and limit-requests /
    remaining-requests (per day) are persisted with wall-clock reset times and can only tighten
    the budget. No daily token information is inferred from them.
  operator_duties:
    - "Keep all other traffic (other scripts, apps, team members) off the same Groq organisation's quota for the whole run. The guard sees other traffic only through rate-limit headers, after the fact."
    - "Verify gpt-oss-120b's limits and the account's daily token budget in the Groq console before the run; supply the remaining daily budget with its source and time."
  daily_accounting:
    - "Usable daily tokens = operator remaining budget x 0.9 - ledger daily_tokens since the budget's verification time."
    - "An attempt that doesn't fit is not sent; the pacer is then exhausted and the run is marked incomplete."
    - "A run is complete only if every case ran and no reservation was refused or exceeded."
  preflight: >-
    `eval-validate --dataset routewise_bench_v5 --revision routewise_bench_v5.2.2`: unchanged from
    v5.1, v5.2 and v5.2.1 (378 maximum provider attempts for 135 gateway requests; fails closed without a verified
    daily budget).

scope:
  model_families: >-
    Every pinned model is OpenAI GPT-OSS on Groq: gpt-oss-20b serves the small tier and
    gpt-oss-120b the premium tier, and there is no medium-tier model. The comparison is between
    two sizes of one model family.
  premium_meaning: '"Premium" means the best free model available, not a frontier model.'
  generalisation: >-
    Results apply only to this fixed 45-case suite (routewise_bench_v5 at the SHA-256 above) under
    the pinned configuration, providers, pacing and run date. They cannot establish general
    performance on production workloads.

execution:
  pairing: Strategies interleaved per case (order alternates by case index).
  temperature: 0
  retries_and_fallbacks: As pinned (Groq max_retries 1; fallbacks within the decision's eligible models); each attempt individually reserved.
  tenant: A dedicated evaluation tenant with no budget.
  code_execution: none.
  concurrency: 1
  delay_s: 6.0

reporting:
  per_case: Answering model as reported by the provider, registry model and tier, and every attempt.
  per_strategy: Answer availability separately from the pass rate (conditional on an answer being returned), plus pass_rate_unconditional.
  quota: The run snapshot records the preflight, the stop reason (if any) and the number of reserved attempts.

primary_metric: pass_rate (conditional on an answer being returned)
primary_population: All 45 cases; a case without an answer is missing, not failed.

run_validity:
  min_answered_fraction: 0.95
  provider_errors: missing
  rule: >-
    Valid only if every strategy answered at least 43 of 45 cases, every answer came from a
    manifest model, every baseline attempt was premium-tier, and the run was not stopped by the
    quota guard. Invalid runs are incomplete and not used for any claim.

baseline_floor:
  rule: Below a 0.60 conditional baseline pass rate the comparison is uninformative.
  floor: 0.60

quality_rule:
  description: Non-inferior if the conditional pass rate is no more than 5 percentage points below the baseline's.
  non_inferiority_margin: 0.05
  also_report: Wilson 95% CIs; paired bootstrap 95% CI of the difference over cases answered by both. "Supported" only if the lower bound is above -0.05.

secondary_rules:
  per_difficulty: Descriptive only.

cost_rule:
  description: Lower-cost claims need CI-supported non-inferiority, lower estimated list cost per accepted answer, no unknown cost observations, a valid run and the baseline floor met.
  requires_ci_supported_non_inferiority: true
  unknown_cost_observations: block
  basis: Estimated list-price (shadow) cost; actual charges on Groq's Free plan are $0.

latency:
  report: p50 and p95 end-to-end latency per strategy. Pacing waits happen before each request and are excluded; waits for a retry or fallback reservation inside a request are included (rare, and noted).
  informational_slo_p95_ms: 15000

per_case_limits:
  simple:   {max_cost_usd: "0.0005", max_latency_ms: 10000}
  standard: {max_cost_usd: "0.002",  max_latency_ms: 15000}
  complex:  {max_cost_usd: "0.005",  max_latency_ms: 30000}

statistics:
  bootstrap_resamples: 10000
  bootstrap_seed: 20261104

publication:
  dataset_review_required: true
  rule: Only after every case is human-reviewed (a valid reviewed_by entry in the pinned metadata, or coverage by the pinned owner review attestation), only from simulated=false, complete and valid runs, and only with the scope statements, the conditional-pass-rate label, each strategy's answer rate and the T17 translator-assisted review disclosure.
