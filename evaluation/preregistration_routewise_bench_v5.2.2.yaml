# RouteWise benchmark pre-registration for routewise_bench_v5.2.2 (prereg-v5.2.2): an
# ADMINISTRATIVE PUBLICATION-GATE AMENDMENT of routewise_bench_v5.2.1. Written on 2026-11-04 (2026-11-04T17:03:15Z) BEFORE any run.
# No live benchmark of any version has been run; the only benchmark execution so far was a
# simulated (mock-provider) pipeline check on v1.
#
# What v5.2.2 is: v5.2.1 unchanged (dataset routewise_bench_v5, scoring amendment for S15, T11 and
# C12, execution, quota and every quality, cost, scope and validity rule), except how the
# publication gate establishes that the dataset is human-reviewed: every case is considered
# reviewed if it has a valid owner-reviewed entry in the pinned metadata's reviewed_by, OR it is
# covered by the exact, independently hashed owner review attestation pinned below.
#
# Pinning chain: routewise_bench_v5.2.2.revision.yaml pins this file's SHA-256; this file pins the
# dataset, its metadata, the scoring amendment, the review attestation and the schema-6 manifest
# (which pins the same evidence files again plus all execution code). The runner and `eval-run
# --revision routewise_bench_v5.2.2` refuse to start, before any network call, if any link fails.
# prereg-v1 to -v5.2.1 are unchanged.
