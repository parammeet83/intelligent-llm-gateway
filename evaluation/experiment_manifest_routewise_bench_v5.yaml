notes:
- 'Intended live configuration: Groq only (Free plan); OpenRouter, Ollama and mock disabled.'
- The runner rebuilds `pinned` from the live configuration before any network call and refuses to run
  on any difference.
- File hashes are SHA-256 over LF-normalised text. Code is uncommitted, so file hashes (not a git commit)
  identify the code version.
- No secrets are recorded. Settings values below are non-secret execution parameters.
- 'Schema 2 hashes every module on the execution path: routing engine/features/config, provider interface,
  HTTP adapter and usage extraction, the enabled provider adapter, executor (retries and fallbacks), gateway
  pipeline and factory, health/circuit breaker, cost and budget accounting, rate limiting, API schemas,
  settings, and all evaluation code.'
- Schema 3 adds the CLI (argument handling and preflight), quota pacing, error types and the dependency
  lock (uv.lock), the Python version, the presence (not values) of proxy/certificate environment variables,
  and app_env.
- 'Quota: execution.quota.groq pins the limits and pacing rules used by the token-aware pacer (worst-case
  reservation per call, all Groq models combined, safety factors, min(pinned, header) rule, stop instead
  of exceed). Only tokens_per_minute and requests_per_day were observed on this account; the others are
  published Developer-plan base limits treated as upper bounds.'
- 'Pacing: requests run strictly one at a time (concurrency 1) with delay_s seconds after every request
  and no case limit. The 6 s delay is a floor only; token-per-minute compliance comes from the quota pacer,
  not from the delay. eval-run refuses any other --delay-s, --limit or --allow-code-exec.'
