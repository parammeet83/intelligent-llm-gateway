policies:
  carried_over: The 11 genuine results persisted by the interrupted v5.2.3 runs are reused unchanged,
    linked by their evaluation-result and request-log IDs, and never re-run. The original runs stay `failed`.
  execution: 'One recovery run per strategy executes exactly the 25 listed combinations, in the registered
    Day 2 order (continuing the interrupted sequence at routewise_tier_first/T02), with the registered
    configuration: concurrency 1, 6 s delay, Groq max_retries 1, fallbacks within each decision''s eligible
    models, the per-attempt quota guard and the operator-verified daily budget.'
  provider_failures: A provider failure or a failed answer is recorded as that combination's genuine outcome
    (answer missing under run_validity) and is never re-run.
  database_failures: Database operations are retried with bounded backoff (1, 2, 4, 8, 16 s). A combination
    is retried only if the quota ledger proves no provider attempt was reserved for it; otherwise the
    run stops (fail closed). Result persistence is idempotent on (run, case). Finalisation is retried
    and never hides the original error; runs left `running` are closed with `eval-finalize-runs`.
  runs_once: The recovery runs once. If it has started (any run carries this plan), it is never restarted;
    an incomplete recovery stays incomplete.
completeness: Complete only if all 36 combinations have exactly one persisted result (11 carried over
  + 25 recovered), each linked to its request log; every recovery run is `completed`; the three original
  runs stay `failed`; and the report built from Neon (eval-recovery-report) reports 0 missing and no validation
  problem.
publishability: Never publishable as a confirmatory, pre-registered result.
