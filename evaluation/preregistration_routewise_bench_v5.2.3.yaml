# RouteWise benchmark pre-registration for routewise_bench_v5.2.3 (prereg-v5.2.3): an
# EXECUTION-SCHEDULE AMENDMENT of routewise_bench_v5.2.2. Written on 2026-11-04 (2026-11-04T18:25:33Z) BEFORE any run.
# No live benchmark of any version has been run; the only benchmark execution so far was a
# simulated (mock-provider) pipeline check on v1.
#
# What v5.2.3 is: v5.2.2 unchanged (dataset, scoring amendment, review attestation gate, quota guard,
# every quality, cost, scope, validity and publication rule), except that the comparison runs over
# four registered UTC days instead of one, because its worst case exceeds one day of Groq quota.
# The case-to-day allocation is pinned below; each case's three strategies run on the same day.
#
# Pinning chain: routewise_bench_v5.2.3.revision.yaml pins this file's SHA-256; this file pins the
# dataset, its metadata, the scoring amendment, the review attestation, the execution schedule and
# the schema-6 manifest (which pins the same evidence files again plus all execution code).
# prereg-v1 to -v5.2.2 are unchanged.
