# Render Blueprint: free-tier API. The dashboard is hosted on Vercel (frontend/vercel.json).
# Database = Neon (not Render Postgres, whose free tier expires after 30 days). Secrets use
# `sync: false`: Render prompts for them in its dashboard; they are never stored in this file.
services:
  - type: web
    name: routewise-api
    runtime: docker
    plan: free
    region: singapore # next to the Neon project (ap-southeast-1)
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: API_KEY_PEPPER
        sync: false
      - key: CORS_ORIGINS
        sync: false # the Vercel dashboard URL, e.g. https://routewise-dashboard.vercel.app
      # Providers. With only the mock enabled, the dashboard shows the DEMO banner.
      - key: MOCK_PROVIDER_ENABLED
        value: "true"
      - key: GROQ_ENABLED
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BILLING_PLAN
        value: unknown
      - key: OPENROUTER_ENABLED
        value: "false"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OLLAMA_ENABLED
        value: "false" # local only; refused in production
