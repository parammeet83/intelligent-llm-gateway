name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Disposable Postgres for CI only. Its password exists only inside this job.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: routewise
          POSTGRES_PASSWORD: routewise-ci
          POSTGRES_DB: routewise_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U routewise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      # PostgreSQL variants of the DB tests (incl. concurrent budget reservations) run here.
      TEST_DATABASE_URL: postgresql://routewise:routewise-ci@localhost:5432/routewise_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy app tests
      - name: Migrations apply to PostgreSQL
        run: uv run alembic -x "db_url=$TEST_DATABASE_URL" upgrade head
      - name: Tests (SQLite + PostgreSQL)
        run: uv run pytest -q -W error::RuntimeWarning
      - name: Dependency audit
        run: |
          uv export --no-hashes --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --disable-pip --no-deps

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Secret scan (fails on anything not in the reviewed baseline)
        run: git ls-files -z | xargs -0 uvx --from detect-secrets detect-secrets-hook --baseline .secrets.baseline

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Playwright (desktop + mobile; mock provider, throwaway SQLite)
        run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
